[package]
name = "tiktok-bot"
version = "1.0.0"
edition = "2021"
description = "High-performance Telegram bot for downloading media from social networks written in Rust"

[lib]
name = "tiktok_bot"
path = "src/lib.rs"

[[bin]]
name = "tiktok-bot"
path = "src/main.rs"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
regex = "1.11"
url = "2.5"
form_urlencoded = "1.2"
uuid = { version = "1.13", features = ["v4", "fast-rng"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.17"
